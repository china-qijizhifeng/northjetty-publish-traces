<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torch Trace Viewer</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2b3441;
    --fg:#e6edf3; --dim:#8b949e; --accent:#4c9aff; --accent2:#3fb950;
    --warn:#d29922; --err:#f85149; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Noto Sans SC",sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--border:#d0d7de;--fg:#1f2328;--dim:#636c76;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column}
  button{font:inherit;color:inherit}
  button:focus-visible,#drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .browser{display:grid;gap:8px;padding:8px 18px 10px;border-bottom:1px solid var(--border);flex:0 0 auto;background:var(--panel)}
  .browser-head{display:flex;align-items:center;gap:10px;min-width:0}
  #site-title{flex:0 0 auto;font-size:12px}
  #compact-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-family:var(--mono);font-size:11px}
  #toggle-browser{flex:0 0 auto;margin-left:auto;padding:4px 9px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);cursor:pointer;font-size:11px}
  #toggle-browser:hover{border-color:var(--accent);color:var(--accent)}
  .browser-content{display:grid;gap:8px}
  .browser.collapsed{gap:4px;padding:6px 12px}
  .browser.collapsed .browser-content{display:none}
  .mini-load{height:3px;overflow:hidden;border-radius:2px;background:var(--panel2)}
  .mini-load[hidden]{display:none}
  .browser:not(.collapsed) .mini-load{display:none}
  #mini-load-bar{height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .12s linear}
  .browser.load-waiting #mini-load-bar{background:linear-gradient(90deg,var(--warn) 0 35%,#f0c968 50%,var(--warn) 65% 100%);background-size:220% 100%;animation:load-sweep 1.1s linear infinite}
  .browser.load-done #mini-load-bar{background:var(--accent2)}
  .browser.load-error #mini-load-bar{background:var(--err)}
  .nav-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;align-items:start}
  .nav-label{display:flex;align-items:center;gap:7px;color:var(--dim);font-family:var(--mono);font-size:11px;line-height:28px}
  .nav-label b{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--border);border-radius:50%;font-size:10px;line-height:1}
  .choices{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .date-section{flex:1 1 100%;display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;align-items:start;min-width:0;padding:3px 0}
  .date-section + .date-section{border-top:1px solid var(--border);padding-top:8px}
  .date-heading{display:grid;gap:1px;padding-top:5px;min-width:0}
  .date-label{font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap}
  .date-count{color:var(--dim);font-family:var(--mono);font-size:9px;white-space:nowrap}
  .date-items{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .empty{color:var(--dim);font-size:12px;line-height:28px}
  .group,.rk,.trace{position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:.12s}
  .group{--tone:var(--accent);display:grid;gap:1px;padding:5px 9px;text-align:left}
  .group.mm{--tone:var(--accent2)}
  .group.dp{--tone:var(--warn)}
  .group:hover,.group.active{border-color:var(--tone);color:var(--tone)}
  .group.active{box-shadow:inset 0 -2px var(--tone)}
  .group-name{font-size:11px;font-weight:650;white-space:nowrap}
  .group-meta{color:var(--dim);font-family:var(--mono);font-size:9px}
  .rk{min-width:52px;padding:5px 8px;font-family:var(--mono);font-size:11px}
  .rk:hover,.rk.active{border-color:var(--accent);color:var(--accent)}
  .rk.active{box-shadow:inset 0 -2px var(--accent)}
  .count{display:inline-grid;place-items:center;min-width:16px;height:16px;margin-left:5px;padding:0 4px;border-radius:8px;background:var(--border);color:var(--fg);font-size:9px}
  .trace{min-width:154px;max-width:300px;padding:5px 9px;text-align:left}
  .trace:hover,.trace.active{border-color:var(--accent);color:var(--accent)}
  .trace.active{box-shadow:inset 0 -2px var(--accent)}
  .trace.done{border-color:var(--accent2)}
  .trace-main{display:block;font-family:var(--mono);font-size:11px;white-space:nowrap}
  .trace-meta{display:block;margin-top:1px;color:var(--dim);font-family:var(--mono);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .08s}
  .loader{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
  .loader[hidden]{display:none}
  .load-head{display:flex;align-items:center;gap:12px;min-width:0}
  #load-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}
  #load-percent{margin-left:auto;flex:0 0 auto;color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:700}
  .load-track{height:8px;overflow:hidden;border-radius:5px;background:var(--panel2)}
  #load-bar{height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .12s linear}
  #load-detail{color:var(--dim);font-family:var(--mono);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loader.waiting{border-color:var(--warn)}
  .loader.waiting #load-percent{color:var(--warn)}
  .loader.waiting #load-bar{background:linear-gradient(90deg,var(--warn) 0 35%,#f0c968 50%,var(--warn) 65% 100%);background-size:220% 100%;animation:load-sweep 1.1s linear infinite}
  .loader.done{border-color:var(--accent2)}
  .loader.done #load-percent{color:var(--accent2)}
  .loader.done #load-bar{background:var(--accent2)}
  .loader.error{border-color:var(--err)}
  .loader.error #load-percent{color:var(--err)}
  .loader.error #load-bar{background:var(--err)}
  @keyframes load-sweep{to{background-position:-220% 0}}
  .tools{display:flex;align-items:center;gap:10px;padding-top:7px;border-top:1px solid var(--border);min-width:0}
  #selection{color:var(--dim);font-size:11px;white-space:nowrap}
  #drop{flex:0 0 auto;font-size:11px;color:var(--dim);border:1px dashed var(--border);border-radius:7px;padding:5px 10px;cursor:pointer}
  #drop.hot{border-color:var(--accent);color:var(--fg)}
  #log{min-width:0;margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{flex:1 1 auto;position:relative;min-height:0}
  #pf{width:100%;height:100%;border:0;display:block}
  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
        color:var(--dim);font-size:14px;gap:8px;text-align:center;padding:20px}
  #hint code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
  a{color:var(--accent)}
  @media (max-width:720px){
    .browser{padding:9px 12px}
    .browser.collapsed{padding:6px 10px}
    .nav-row{grid-template-columns:1fr;gap:3px}
    .nav-label{line-height:22px}
    .date-section{grid-template-columns:1fr;gap:4px}
    .date-heading{display:flex;align-items:baseline;gap:8px;padding-top:2px}
    .tools{align-items:flex-start;flex-wrap:wrap}
    #log{order:3;flex-basis:100%;margin-left:0;text-align:left}
  }
</style>
</head>
<body>
<section class="browser" id="browser" aria-label="Trace 选择器">
  <div class="browser-head">
    <strong id="site-title">Torch Trace Viewer</strong>
    <span id="compact-summary">尚未选择 trace</span>
    <button id="toggle-browser" type="button" aria-expanded="true" aria-controls="browser-content">收起选择 ▴</button>
  </div>
  <div class="mini-load" id="mini-load" hidden role="progressbar" aria-label="折叠状态下的 Trace 加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="mini-load-bar"></div>
  </div>
  <div class="browser-content" id="browser-content">
  <div class="nav-row">
    <div class="nav-label"><b>1</b><span>场景</span></div>
    <div class="choices" id="groups"><span class="empty">加载 manifest…</span></div>
  </div>
  <div class="nav-row">
    <div class="nav-label"><b>2</b><span>Rank</span></div>
    <div class="choices" id="ranks"><span class="empty">先选一个场景</span></div>
  </div>
  <div class="nav-row">
    <div class="nav-label"><b>3</b><span>Trace</span></div>
    <div class="choices" id="traces"><span class="empty">先选一个 rank</span></div>
  </div>
  <div class="loader" id="loader" hidden aria-live="polite" aria-atomic="true">
    <div class="load-head">
      <strong id="load-title">准备加载 trace</strong>
      <span id="load-percent">0%</span>
    </div>
    <div class="load-track" id="load-track" role="progressbar" aria-label="Trace 加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="load-bar"></div>
    </div>
    <div id="load-detail"></div>
  </div>
  <div class="tools">
    <span id="selection">尚未选择 trace</span>
    <span id="log" role="status" aria-live="polite"></span>
    <div id="drop" role="button" tabindex="0">拖入或选择本地 trace</div>
    <input id="file" type="file" accept=".json,.gz,.pb,.perfetto-trace" hidden>
  </div>
  </div>
</section>
<div id="stage">
  <iframe id="pf" src="about:blank" title="Perfetto trace viewer"></iframe>
  <div id="hint">
    <div class="hint-main">↑ 上方选择场景、rank 和 trace，Perfetto 会在这里打开</div>
    <div class="hint-detail" style="font-size:12px">站点可以从零条 trace 开始；也可以从上方拖入本地 <code>.trace.json</code> 或 <code>.trace.json.gz</code></div>
  </div>
</div>

<script>
const PERFETTO = "https://ui.perfetto.dev";
const siteTitleEl = document.getElementById("site-title");
const groupChoices = document.getElementById("groups");
const rankChoices = document.getElementById("ranks");
const traceChoices = document.getElementById("traces");
const browserPanel = document.getElementById("browser");
const compactSummary = document.getElementById("compact-summary");
const toggleBrowser = document.getElementById("toggle-browser");
const miniLoad = document.getElementById("mini-load");
const miniLoadBar = document.getElementById("mini-load-bar");
const selectionEl = document.getElementById("selection");
const logEl = document.getElementById("log");
const loadPanel = document.getElementById("loader");
const loadTitle = document.getElementById("load-title");
const loadPercent = document.getElementById("load-percent");
const loadTrack = document.getElementById("load-track");
const loadBar = document.getElementById("load-bar");
const loadDetail = document.getElementById("load-detail");
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
let iframe = document.getElementById("pf");
const hint = document.getElementById("hint");
const hintMain = hint.querySelector(".hint-main");
const hintDetail = hint.querySelector(".hint-detail");
function log(m){ if(logEl) logEl.textContent = m; }
function setSelection(text){
  selectionEl.textContent = text;
  compactSummary.textContent = text;
  if(!activeFetch){
    miniLoad.hidden = true;
    browserPanel.classList.remove("load-fetching","load-waiting","load-done","load-error");
  }
}
function showLoad(phase, title, percent, detail, percentText){
  const value = Math.max(0,Math.min(100,percent));
  const statusText = percentText || `${Math.round(value)}%`;
  loadPanel.hidden = false;
  loadPanel.className = `loader ${phase}`;
  loadTitle.textContent = title;
  loadPercent.textContent = statusText;
  loadBar.style.width = `${value}%`;
  loadDetail.textContent = detail;
  loadTrack.setAttribute("aria-valuenow",String(Math.round(value)));
  loadTrack.setAttribute("aria-valuetext",loadPercent.textContent);
  browserPanel.classList.remove("load-fetching","load-waiting","load-done","load-error");
  browserPanel.classList.add(`load-${phase}`);
  compactSummary.textContent = `${title} · ${statusText}`;
  miniLoad.hidden = false;
  miniLoadBar.style.width = `${value}%`;
  miniLoad.setAttribute("aria-valuenow",String(Math.round(value)));
  miniLoad.setAttribute("aria-valuetext",statusText);
}

function abortError(){ const e = new Error("已切换到其他 trace"); e.name = "AbortError"; return e; }
function setHint(main, detail=""){
  hintMain.textContent = main;
  hintDetail.textContent = detail;
  hint.style.display = "flex";
}

// Perfetto 对已打开 trace 的 iframe 不会稳定接受第二次导入。每次都换新 iframe,确保切换生效。
function freshPerfetto(token){
  const frame = document.createElement("iframe");
  frame.id = "pf"; frame.title = "Perfetto trace viewer"; frame.src = "about:blank";
  iframe.replaceWith(frame); iframe = frame;
  setHint("正在启动新的 Perfetto…", "新 trace 会替换当前视图");
  return new Promise((resolve,reject)=>{
    let settled = false;
    const cleanup = ()=>{
      clearInterval(pingTimer); clearTimeout(timeout);
      window.removeEventListener("message", onMsg);
    };
    const finish = (error)=>{
      if(settled) return; settled = true; cleanup();
      error ? reject(error) : resolve(frame);
    };
    const onMsg = (e)=>{
      if(e.source === frame.contentWindow && e.origin === PERFETTO && e.data === "PONG") finish();
    };
    const pingTimer = setInterval(()=>{
      if(token !== loadToken){ finish(abortError()); return; }
      try{ frame.contentWindow.postMessage("PING", PERFETTO); }catch(e){}
    }, 75);
    const timeout = setTimeout(()=>finish(new Error("Perfetto 启动超时")), 30000);
    window.addEventListener("message", onMsg);
    frame.src = PERFETTO;
  });
}
async function showInPerfetto(buffer, title, token){
  const frame = await freshPerfetto(token);
  if(token !== loadToken) throw abortError();
  frame.contentWindow.postMessage({perfetto:{buffer,title}}, PERFETTO, [buffer]);
  hint.style.display = "none";
}

// —— 分块拉取并拼回完整 buffer ——
async function fetchParts(tr, onProg, signal){
  const chunks = []; let got = 0;
  for(let partIndex=0;partIndex<tr.parts.length;partIndex++){
    const url = tr.parts[partIndex];
    const r = await fetch(url, {cache:"no-store", signal});
    if(!r.ok) throw new Error(`拉取 ${url} 失败 HTTP ${r.status}`);
    if(r.body){
      const reader = r.body.getReader();
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        chunks.push(value); got += value.byteLength;
        onProg(got,tr.size,partIndex+1,tr.parts.length);
      }
    }else{
      const ab = await r.arrayBuffer();
      chunks.push(new Uint8Array(ab)); got += ab.byteLength;
      onProg(got,tr.size,partIndex+1,tr.parts.length);
    }
  }
  const total = chunks.reduce((a,b)=>a+b.length,0);
  if(total !== tr.size) throw new Error(`拼接大小不符 ${total}!=${tr.size}`);
  const out = new Uint8Array(total); let off=0;
  for(const c of chunks){ out.set(c, off); off += c.length; }
  return out.buffer;
}

const state = {byGroup:{}, groupMeta:{}, groupOrder:[], group:null, rank:null};
let activeTraceEl = null;
let loadToken = 0;
let activeFetch = null;
const COLLAPSE_KEY = "northjetty-torch-trace-browser-collapsed";

function groupLabel(group){
  const meta = state.groupMeta[group];
  return (meta && meta.label) || group.replace(/[-_]+/g," ");
}

function setBrowserCollapsed(collapsed, persist=true){
  browserPanel.classList.toggle("collapsed",collapsed);
  toggleBrowser.setAttribute("aria-expanded",String(!collapsed));
  toggleBrowser.textContent = collapsed ? "展开选择 ▾" : "收起选择 ▴";
  toggleBrowser.title = collapsed ? "展开场景、Rank 和 Trace 选择器" : "收起选择器，放大 Perfetto";
  if(persist){ try{ localStorage.setItem(COLLAPSE_KEY,collapsed?"1":"0"); }catch(e){} }
}
toggleBrowser.onclick=()=>setBrowserCollapsed(!browserPanel.classList.contains("collapsed"));
try{ setBrowserCollapsed(localStorage.getItem(COLLAPSE_KEY)==="1",false); }
catch(e){ setBrowserCollapsed(false,false); }

function cancelPendingLoad(){
  loadToken++;
  if(activeFetch) activeFetch.abort();
  activeFetch = null;
}

function humanSize(bytes){ return `${(bytes/1e6).toFixed(1)} MB`; }
function timestampFromFilename(filename){
  const match = filename && filename.match(/(?:^|[^\d])(\d{10}(?:\.\d+)?)(?=[^\d]|$)/);
  if(!match) return null;
  const value = Number(match[1]);
  return Number.isFinite(value) && value > 0 ? value : null;
}
function traceTimestamp(tr){
  for(const key of ["timestamp_epoch","mtime_epoch"]){
    const value = Number(tr && tr[key]);
    if(Number.isFinite(value) && value > 0) return value;
  }
  return timestampFromFilename(tr && tr.file);
}
function localDateKey(timestamp){
  if(timestamp === null) return "__unknown__";
  const date = new Date(timestamp*1000);
  const pad = value=>String(value).padStart(2,"0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}
function localDateLabel(timestamp){
  if(timestamp === null) return "未知日期";
  const weekday = new Intl.DateTimeFormat("zh-CN",{weekday:"short"}).format(new Date(timestamp*1000));
  return `${localDateKey(timestamp)} · ${weekday}`;
}
function localTimeLabel(timestamp){
  if(timestamp === null) return "未知时间";
  return new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).format(new Date(timestamp*1000));
}
function compareTracesNewestFirst(a,b){
  const at = traceTimestamp(a), bt = traceTimestamp(b);
  if(at === null && bt !== null) return 1;
  if(at !== null && bt === null) return -1;
  if(at !== null && bt !== null && at !== bt) return bt-at;
  return (b.file||"").localeCompare(a.file||"",undefined,{numeric:true});
}
function latestTraceTimestamp(traces){
  let latest = null;
  for(const trace of traces){
    const timestamp = traceTimestamp(trace);
    if(timestamp !== null && (latest === null || timestamp > latest)) latest = timestamp;
  }
  return latest;
}
function createDateSection(container, timestamp, count, noun){
  const section=document.createElement("section"); section.className="date-section"; section.dataset.date=localDateKey(timestamp);
  const heading=document.createElement("div"); heading.className="date-heading";
  const label=document.createElement("span"); label.className="date-label"; label.textContent=localDateLabel(timestamp);
  const total=document.createElement("span"); total.className="date-count"; total.textContent=`${count} ${noun}`;
  const items=document.createElement("div"); items.className="date-items";
  heading.append(label,total); section.append(heading,items); container.appendChild(section);
  return items;
}
function traceLabel(tr, index, total){
  if(tr.label) return tr.label;
  const timestamp = traceTimestamp(tr);
  if(timestamp !== null) return `${localTimeLabel(timestamp)}${index === 0 && total > 1 ? " · 最新" : ""}`;
  return total > 1 ? `Trace ${index+1}` : "Trace";
}
function groupByRank(traces){
  const out = new Map();
  for(const tr of traces){ if(!out.has(tr.rank)) out.set(tr.rank,[]); out.get(tr.rank).push(tr); }
  return out;
}
function setEmpty(container, text){ container.innerHTML = ""; const el=document.createElement("span"); el.className="empty"; el.textContent=text; container.appendChild(el); }

function selectGroup(group){
  cancelPendingLoad();
  state.group = group; state.rank = null;
  for(const el of groupChoices.querySelectorAll(".group")) el.classList.toggle("active", el.dataset.group === group);
  renderRanks(group);
  setEmpty(traceChoices, "先选一个 rank");
  setSelection(`场景: ${groupLabel(group)}`);
  log("请选择 rank");
}

function renderRanks(group){
  rankChoices.innerHTML = "";
  const ranks = groupByRank(state.byGroup[group]);
  const names = [...ranks.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  for(const rank of names){
    const traces = ranks.get(rank);
    const el = document.createElement("button"); el.type="button"; el.className="rk"; el.dataset.rank=rank;
    el.append(document.createTextNode(rank));
    if(traces.length > 1){ const count=document.createElement("span"); count.className="count"; count.textContent=traces.length; el.appendChild(count); }
    el.title = `${rank} · ${traces.length} trace${traces.length>1?"s":""}`;
    el.onclick = ()=>selectRank(group, rank, traces, el);
    rankChoices.appendChild(el);
  }
}

function selectRank(group, rank, traces, rankEl){
  cancelPendingLoad();
  state.rank = rank;
  for(const el of rankChoices.querySelectorAll(".rk")) el.classList.toggle("active", el === rankEl);
  traceChoices.innerHTML = ""; activeTraceEl = null;
  const ordered = [...traces].sort(compareTracesNewestFirst);
  const dated = new Map();
  ordered.forEach((trace,index)=>{
    const timestamp=traceTimestamp(trace), key=localDateKey(timestamp);
    if(!dated.has(key)) dated.set(key,{timestamp,entries:[]});
    dated.get(key).entries.push({trace,index});
  });
  for(const bucket of dated.values()){
    const items=createDateSection(traceChoices,bucket.timestamp,bucket.entries.length,"traces");
    for(const {trace:tr,index} of bucket.entries){
      const el=document.createElement("button"); el.type="button"; el.className="trace"; el.title=tr.file||"";
      const main=document.createElement("span"); main.className="trace-main"; main.textContent=traceLabel(tr,index,ordered.length);
      const meta=document.createElement("span"); meta.className="trace-meta"; meta.textContent=`${humanSize(tr.size)} · ${tr.file||"trace"}`;
      const progress=document.createElement("span"); progress.className="p";
      el.append(main,meta,progress);
      el.onclick=()=>openTrace(tr,group,rank,el,index,ordered.length);
      items.appendChild(el);
    }
  }
  setSelection(`${groupLabel(group)} / ${rank} · ${ordered.length} trace${ordered.length>1?"s":""} · 最新优先`);
  if(ordered.length === 1) openTrace(ordered[0],group,rank,traceChoices.querySelector(".trace"),0,1);
  else log(`该 rank 有 ${ordered.length} 条 trace，已按日期和时间倒序排列`);
}

async function openTrace(tr, group, rank, el, index, total){
  if(activeTraceEl) activeTraceEl.classList.remove("active");
  activeTraceEl = el; el.classList.add("active");
  const progress = el.querySelector(".p");
  const token = ++loadToken;
  if(activeFetch) activeFetch.abort();
  const controller = new AbortController(); activeFetch = controller;
  const label = traceLabel(tr,index,total);
  const shortTitle = `${rank} · ${label}`;
  setSelection(`${groupLabel(group)} / ${rank} / ${label}`);
  log(`拉取 ${rank}/${label} …`);
  showLoad("fetching",`正在加载：${shortTitle}`,0,`准备下载 ${humanSize(tr.size)} · ${tr.parts.length} 个分块`);
  try{
    const buf = await fetchParts(tr,(got,tot,part,parts)=>{
      const percent = 100*got/tot;
      progress.style.width=percent+"%";
      showLoad("fetching",`正在加载：${shortTitle}`,percent,`分块 ${part}/${parts} · ${humanSize(got)} / ${humanSize(tot)}`);
    },controller.signal);
    if(token !== loadToken) throw abortError();
    log(`${humanSize(buf.byteLength)} · 正在替换 Perfetto…`);
    showLoad("waiting",`下载完成：${shortTitle}`,100,`${humanSize(buf.byteLength)} 已下载 · 正在启动新的 Perfetto 实例`,`启动中`);
    await showInPerfetto(buf, `${groupLabel(group)} / ${rank} / ${label}`, token);
    if(token !== loadToken) throw abortError();
    el.classList.add("done");
    showLoad("done",`已发送：${shortTitle}`,100,`网络加载完成 · Perfetto 正在解析；大 trace 可能还需要几秒`,`100%`);
    log(`100% · ${rank}/${label} 已发送到 Perfetto`);
  }catch(e){
    if(e.name !== "AbortError" && token === loadToken){
      log("✗ "+e.message);
      showLoad("error",`加载失败：${shortTitle}`,100,e.message,"失败");
      setHint("打开 trace 失败", e.message);
    }
  }finally{
    progress.style.width="0";
    if(token === loadToken) activeFetch = null;
  }
}

async function loadManifest(){
  let mf;
  try{ mf = await (await fetch("manifest.json",{cache:"no-store"})).json(); }
  catch(e){ setEmpty(groupChoices,"manifest.json 加载失败: "+e); return; }
  if(mf.site_title){
    document.title = mf.site_title;
    siteTitleEl.textContent = mf.site_title;
  }
  for(const g of (mf.groups||[])){
    if(!g || !g.id) continue;
    state.groupMeta[g.id] = g;
    state.groupOrder.push(g.id);
  }
  for(const t of (mf.traces||[])){ (state.byGroup[t.group]=state.byGroup[t.group]||[]).push(t); }
  groupChoices.innerHTML = "";
  const order = state.groupOrder.filter(g=>state.byGroup[g]).concat(Object.keys(state.byGroup).filter(g=>!state.groupOrder.includes(g)));
  if(!order.length){
    setEmpty(groupChoices,"当前没有已发布 trace");
    setEmpty(rankChoices,"等待 trace");
    setEmpty(traceChoices,"可从下方拖入本地 trace");
    setSelection("空站点 · 可拖入本地 trace");
    log("站点已就绪，尚未发布 trace");
    return;
  }
  const orderedGroups=order.map((group,index)=>({group,index,traces:state.byGroup[group],timestamp:latestTraceTimestamp(state.byGroup[group])})).sort((a,b)=>{
    if(a.timestamp === null && b.timestamp !== null) return 1;
    if(a.timestamp !== null && b.timestamp === null) return -1;
    if(a.timestamp !== null && b.timestamp !== null && a.timestamp !== b.timestamp) return b.timestamp-a.timestamp;
    return a.index-b.index;
  });
  const datedGroups=new Map();
  for(const record of orderedGroups){
    const key=localDateKey(record.timestamp);
    if(!datedGroups.has(key)) datedGroups.set(key,{timestamp:record.timestamp,records:[]});
    datedGroups.get(key).records.push(record);
  }
  for(const bucket of datedGroups.values()){
    const items=createDateSection(groupChoices,bucket.timestamp,bucket.records.length,"场景");
    for(const {group,index,traces,timestamp} of bucket.records){
      const ranks=groupByRank(traces).size;
      const tone = ["","mm","dp"][index%3];
      const el=document.createElement("button"); el.type="button"; el.className=`group ${tone}`; el.dataset.group=group;
      const name=document.createElement("span"); name.className="group-name"; name.textContent=groupLabel(group);
      const meta=document.createElement("span"); meta.className="group-meta"; meta.textContent=`最新 ${localTimeLabel(timestamp)} · ${ranks} ranks · ${traces.length} traces`;
      el.append(name,meta); el.onclick=()=>selectGroup(group); items.appendChild(el);
    }
  }
  if(orderedGroups.length) selectGroup(orderedGroups[0].group);
}
async function handleLocal(f){
  if(activeTraceEl) activeTraceEl.classList.remove("active");
  const token = ++loadToken;
  if(activeFetch) activeFetch.abort(); activeFetch = null;
  setSelection(`本地 / ${f.name}`);
  log(`读取 ${f.name} (${(f.size/1e6).toFixed(1)}MB) …`);
  showLoad("fetching",`正在读取：${f.name}`,0,`本地文件 · ${humanSize(f.size)}`);
  try{
    const buf=await f.arrayBuffer();
    showLoad("waiting",`读取完成：${f.name}`,100,`${humanSize(f.size)} 已读取 · 正在启动新的 Perfetto 实例`,`启动中`);
    await showInPerfetto(buf, f.name, token);
    if(token===loadToken){ showLoad("done",`已发送：${f.name}`,100,"Perfetto 正在解析本地 trace","100%"); log(`100% · ${f.name} 已发送到 Perfetto`); }
  }catch(e){
    if(e.name!=="AbortError" && token===loadToken){ log("✗ "+e.message); showLoad("error",`加载失败：${f.name}`,100,e.message,"失败"); }
  }
}
drop.onclick=()=>fileInput.click();
drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();fileInput.click();} };
fileInput.onchange=()=>{ if(fileInput.files[0]) handleLocal(fileInput.files[0]); };
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0]; if(f) handleLocal(f);});
loadManifest();
</script>
